<div class="sa-login">
  <div class="sa-login__card">
    <div class="sa-login__brand">
      <div class="sa-login__logo">
        <img src="assets/img/brand/logo.png" alt="Shlok Ayurveda"
             onerror="this.style.display='none'">
      </div>
      <h1 class="sa-login__title">Shlok Ayurveda</h1>
      <p class="sa-login__subtitle">Admin Panel — sign in to continue</p>
    </div>

    <form class="sa-login__form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>

      <div class="sa-login__field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="username"
               placeholder="you@example.com"
               [class.is-invalid]="submitted && f['email'].errors">
        <small class="sa-login__error" *ngIf="submitted && f['email'].errors?.['required']">
          Email is required.
        </small>
        <small class="sa-login__error" *ngIf="submitted && f['email'].errors?.['email']">
          Enter a valid email address.
        </small>
      </div>

      <div class="sa-login__field">
        <label for="password">Password</label>
        <div class="sa-login__password">
          <input id="password" [type]="showPassword ? 'text' : 'password'"
                 formControlName="password" autocomplete="current-password"
                 placeholder="Enter your password"
                 [class.is-invalid]="submitted && f['password'].errors">
          <button type="button" class="sa-login__toggle" (click)="togglePassword()"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <small class="sa-login__error" *ngIf="submitted && f['password'].errors?.['required']">
          Password is required.
        </small>
      </div>

      <div class="sa-login__alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="sa-login__btn" [disabled]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="sa-login__loading">
          <span class="sa-login__spinner"></span> Signing in…
        </span>
      </button>
    </form>

    <p class="sa-login__foot">Authorised personnel only.</p>
  </div>
</div>
